experiment_id: p4_7_region_adapter_moe_tcn_esm2_t33_position_onehot_seed1
stage: P4.7
model: RegionAdapterMoETCN
features:
  - esm
  - position
  - onehot
esm2_model: esm2_t33_650M_UR50D
embedding_dir: data/features/esm2_embeddings/esm2_t33_650M_UR50D_layer33_fp16
train: data/DM3000_Train.fasta
validation: data/DM1229_Validation.fasta
tests:
  - name: SL329
    path: data/SL329_test.fasta
  - name: MXD494
    path: data/MXD494_test.fasta
  - name: DISORDER723
    path: data/DISORDER723_test.fasta
architecture:
  hidden_dim: 128
  layers: 4
  kernels: [3, 7, 15]
  dilations: [1, 2, 4, 8]
  dropout: 0.15
  adapter_dim: 32
  gate_temperature: 1.0
region_experts:
  - sdr
  - ldr
  - terminal_idr
  - internal_idr
training:
  optimizer: AdamW
  learning_rate: 0.001
  weight_decay: 0.0001
  aux_loss_weight: 0.20
  gate_loss_weight: 0.10
  loss_type: bce
  epochs: 8
  max_tokens: 10000
  max_proteins: 32
  threshold_selection: validation Fmax on DM1229_Validation
  seed: 1
comparison_baseline:
  full_train_model: p4_6_region_aware_tcn_esm2_t33_position_onehot_seed1
  full_train_auc:
    SL329: 0.919327
    MXD494: 0.850637
    DISORDER723: 0.944611
  primary_go_no_go:
    - Improve DISORDER723 internal IDR MCC over 0.210033 without reducing overall DISORDER723 AUC below 0.944611 by more than 0.002.
    - Improve MXD494 AUPR/MCC or keep them within 0.002 of P4.6 while improving internal IDR metrics.
    - Preserve Platt calibration compatibility by leaving ranking scores monotonic and threshold selection validation-only.
